interface:
  display_name: "CC3 Resource Management"
  short_description: "Require a competitor URL, write UI-project metadata, then inventory and validate resources without script migration or binding changes."
  default_prompt: "Use $cc3-res-reverse for the supplied UI Cocos project. First require the user to provide an explicit absolute competitor URL using http:// or https://; do not infer, search, access, or scrape it. If it is absent, blank, a placeholder, or invalid, stop before every project operation and request it. Before the Prefab gate, create or update doc/project_info.md with exactly uiProjectPath, gameId, and competitorUrl keys; preserve unrelated user content and do not write placeholders. This file is the authoritative metadata source for later $s-cli resource-project lookup. Before any later conversion, binding, or resource-normalization stage, scan every Prefab under assets excluding library, temp, build, and node_modules; resolve every script component through structural/Cocos validation; repair only proven script-caused missing references using existing script, meta, binding, or class-registry evidence; preserve legacy JS and UUIDs; and stop if any blocking miss, ambiguity, or unavailable required validation remains. After the gate passes, @cc3 remains folder-layout-only: derive the game name, move all contents of assets/resources into assets/resources/<game>_res, and move legacy assets/prefabs into that root's prefabs directory. Keep assets/scenes, assets/scripts, assets/scripts_ts24, assets/scripts_ts3, assets/plugins, and assets/import-materials unchanged. Never guess UUID/class-id, blindly replace UUID text, translate JS to TS, or perform unrelated Prefab/Scene edits. Run the path-reference gate after the Prefab gate, preserve bytes and meta UUIDs, then write the Chinese resource inventory and static operation-flow documents under doc. Report exact gate evidence and block later work when the gate is incomplete."
