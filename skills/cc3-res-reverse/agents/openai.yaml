interface:
  display_name: "CC3 Resource Management"
  short_description: "Inventory and validate one processed Cocos project's resources without script migration or binding changes."
  default_prompt: "Use $cc3-res-reverse for the supplied Cocos project. @cc3 is folder-layout-only: derive the game name, move all contents of assets/resources into assets/resources/<game>_res, and move legacy assets/prefabs into that root's prefabs directory. Keep assets/scenes, assets/scripts, assets/scripts_ts24, assets/scripts_ts3, assets/plugins, and assets/import-materials unchanged. Never translate, generate, copy, rename, move, delete, or type-check JS/TS; never edit Prefab, Scene, Resource JSON, meta contents, UUID, class-id, __type__, __uuid__, fileId, targetOverrides, or script bindings. Run the path-reference gate first, preserve bytes and meta UUIDs, then write the Chinese resource inventory and static operation-flow documents under doc. Report a blocked move rather than editing a path-string reference."
