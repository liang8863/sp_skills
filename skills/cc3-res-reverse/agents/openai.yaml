interface:
  display_name: "CC3 Resource Reverse"
  short_description: "Reverse and organize PG resources inside the given project."
  default_prompt: "Use $cc3-res-reverse when @cc3 or @cc3_res is followed by a processed Cocos project; perform the full resource reverse workflow inside that project only, repair every missing Prefab script reference until the final missing count is zero, and before reporting translation complete write the translated project's reel call logic and Mermaid sequence diagrams, plus the complete resource/prefab inventory with a purpose row for every prefab and the 消除特效用到的预制体逻辑 and 掉落咪牌特效逻辑 modules under doc. After those gates pass, derive <game> from the actual game short name, ensure Prefabs and Scenes resolve only to the translated TS3 scripts, rename assets/scripts_ts3 to assets/scripts_<game>_UI, remove assets/scripts_ts24 and assets/scripts with their meta files, move assets/prefabs into assets/resources/<game>_res/prefabs, preserve assets/resources as the root, validate all references again, and create exactly one commit while excluding generated directories and unrelated dirty work."
